<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8e8e6"><title>Civic OS — Report. Connect. Resolve.</title><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet"><style>

/* Premium refinement — preserve the existing landing-page structure */
:root {
  color-scheme: light;
  --civic-ink: #14231b;
  --civic-muted: #65736b;
  --civic-green: #147a50;
  --civic-green-dark: #0c5136;
  --civic-line: #e4ebe6;
}
body {
  padding: clamp(12px, 2.6vw, 30px);
  background:
    radial-gradient(ellipse at 50% 0%, rgba(36, 139, 91, .09), transparent 44%),
    #f1f4f1;
  color: var(--civic-ink);
}
.frame {
  width: min(1200px, 100%);
  min-height: calc(100svh - clamp(24px, 5.2vw, 60px));
  border: 1px solid rgba(24, 59, 39, .07);
  border-radius: 30px;
  padding: clamp(18px, 3vw, 34px) clamp(18px, 4vw, 46px) 25px;
  box-shadow: 0 24px 80px rgba(21, 50, 33, .075), 0 2px 8px rgba(21, 50, 33, .025);
}
.nav {
  width: min(100%, 920px);
  min-height: 60px;
  gap: 20px;
  padding: 8px 9px 8px 18px;
  border-color: var(--civic-line);
  border-radius: 17px;
  box-shadow: 0 4px 18px rgba(18, 48, 31, .045);
}
.brand { color: var(--civic-ink); font-size: 15px; letter-spacing: -.35px; }
.links { gap: clamp(14px, 2.3vw, 28px); color: #53645a; font-size: 12px; }
.links a { transition: color .18s ease; }
.links a:hover { color: var(--civic-green); }
.signin, .launch {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 650;
  transition: transform .18s ease, background .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.signin { border-color: #dce6df; color: #26392e; padding: 0 16px; }
.signin:hover { background: #f5faf6; border-color: #b9d2c2; }
.launch { background: var(--civic-green-dark); color: #fff; padding: 0 18px; box-shadow: 0 5px 14px rgba(12, 81, 54, .14); }
.launch:hover { background: var(--civic-green); transform: translateY(-1px); box-shadow: 0 8px 20px rgba(12, 81, 54, .18); }
a:focus-visible { outline: 3px solid #6dbd91; outline-offset: 4px; }
.hero { padding: clamp(32px, 5vw, 58px) 0 42px; }
.graphic { width: min(700px, 100%); height: clamp(170px, 24vw, 220px); margin-bottom: 18px; }
.line { background: linear-gradient(90deg, transparent, #dce7df 14%, #dce7df 86%, transparent); }
.core {
  background: linear-gradient(145deg, #21885c, #0d583a);
  box-shadow: 0 16px 34px rgba(16, 111, 69, .22), inset 0 1px 0 rgba(255,255,255,.22);
}
.node { border: 1px solid rgba(255,255,255,.75); box-shadow: 0 9px 24px rgba(20, 48, 32, .10); }
.a { background: #e8f3c7; }
.b { background: #d8f0ee; }
.c { background: #f8d9d2; color: #8b382d; }
.d { background: #f4f6f3; color: #286448; }
.e { background: #dcefe2; color: #216342; }
.f { background: #f8ead6; color: #775222; }
.hero h1 {
  max-width: 850px;
  color: #14231b;
  font-size: clamp(44px, 6.4vw, 76px);
  line-height: 1.04;
  letter-spacing: -.065em;
  font-weight: 650;
  margin: 5px 0 19px;
}
.hero p {
  max-width: 470px;
  color: var(--civic-muted);
  font-size: clamp(15px, 1.6vw, 17px);
  line-height: 1.75;
  margin: 0 auto 28px;
}
.hero .launch {
  min-height: 49px;
  padding: 0 24px;
  background: var(--civic-green-dark);
  font-size: 13px;
  box-shadow: 0 9px 22px rgba(12, 81, 54, .16);
}
.foot {
  padding-top: 19px;
  border-color: #e9eee9;
  color: #78867d;
  font-size: 11px;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
@media (max-width: 680px) {
  body { padding: 9px; }
  .frame {
    min-height: calc(100svh - 18px);
    padding: 13px 15px 18px;
    border-radius: 22px;
  }
  .nav { min-height: 54px; padding: 7px 8px 7px 12px; gap: 8px; border-radius: 14px; }
  .brand { font-size: 14px; }
  .actions { gap: 0; }
  .actions > .launch { min-height: 39px; padding: 0 12px; font-size: 11px; }
  .hero { padding: 26px 0 28px; }
  .graphic { height: 158px; margin-bottom: 12px; }
  .hero h1 { font-size: clamp(40px, 10.7vw, 56px); letter-spacing: -.06em; line-height: 1.06; margin-bottom: 15px; }
  .hero p { max-width: 330px; font-size: 15px; line-height: 1.65; margin-bottom: 23px; }
  .hero .launch { min-height: 47px; }
  .foot { gap: 12px; font-size: 10px; }
}
@media (max-width: 360px) {
  .actions > .launch { padding: 0 9px; font-size: 10px; }
  .hero h1 { font-size: 38px; }
  .foot { font-size: 9px; }
}
